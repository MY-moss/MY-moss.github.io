name: ATLAS quality gate
on:
  push:
    branches: [main]
    paths: ["atlas/**","inspiration/**",".github/workflows/atlas-check.yml",".github/workflows/pages.yml"]
  pull_request:
    paths: ["atlas/**","inspiration/**",".github/workflows/atlas-check.yml",".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Validate public feed, schema and privacy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check atlas/config.js
          node --check atlas/app.js
          node --check atlas/scripts/validate.mjs
      - name: Validate JSON Schema and privacy
        run: npm run validate
