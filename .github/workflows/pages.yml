name: Deploy Pages (game, inspiration, ATLAS)
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run schema, privacy and browser tests
        run: npm test
      - name: Prepare same-origin ATLAS feed
        run: npm run prepare:feed
      - name: Version static assets and Service Worker caches
        run: npm run prepare:release
      - name: Check site assets
        run: |
          test -s atlas/index.html
          test -s atlas/data/index.json
          test -s inspiration/index.html
          node --check atlas/config.js
          node --check atlas/app.js
          node --check inspiration/app.js
      - uses: actions/configure-pages@v5
      - name: Remove test-only files before publishing
        run: rm -rf node_modules test-results playwright-report
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
