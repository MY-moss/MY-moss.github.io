name: Game smoke checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'sw.js'
      - 'manifest.json'
      - 'tests/**'
      - '.github/workflows/game-check.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'sw.js'
      - 'manifest.json'
      - 'tests/**'
      - '.github/workflows/game-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game assets, JavaScript and offline cache
        run: |
          node --test tests/game-smoke.test.mjs tests/round1-engine.test.mjs
          node tests/round1-simulation.cjs
