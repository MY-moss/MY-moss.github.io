name: Game smoke checks
on:
  push:
    branches: [main, 'development/**']
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'sw.js'
      - 'manifest.json'
      - 'tests/**'
      - '.github/workflows/game-check.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'sw.js'
      - 'manifest.json'
      - 'tests/**'
      - '.github/workflows/game-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game assets, JavaScript and offline cache
        run: |
          node --test tests/game-smoke.test.mjs tests/round1-engine.test.mjs tests/round2-content.test.mjs tests/round3-content.test.mjs tests/round4-regressions.test.mjs tests/round5-causal.test.mjs tests/round6-causal-inbox.test.mjs tests/round7-life-paths.test.mjs tests/round8-event-audit.test.mjs tests/round9-event-gates.test.mjs tests/round10-investigation-branches.test.mjs tests/round11-grassroots-branches.test.mjs tests/round12-life-gates.test.mjs tests/round13-network-bridge.test.mjs tests/round14-financial-consequences.test.mjs tests/round15-addiction-and-corruption.test.mjs tests/round16-career-gates.test.mjs tests/round17-secondment-career-paths.test.mjs tests/round18-grassroots-content.test.mjs tests/round19-causal-care-and-assessment.test.mjs tests/round20-investment-exposure.test.mjs tests/round21-npc-memory.test.mjs tests/round23-family-save.test.mjs tests/round24-housing-care.test.mjs tests/round25-finance-retirement.test.mjs tests/round26-health-and-endings.test.mjs tests/round27-team-legacy.test.mjs tests/round28-character-legacy.test.mjs tests/round29-duty-policy-retirement.test.mjs tests/round30-flow-and-reachability.test.mjs tests/round31-causal-clock.test.mjs tests/round32-renewal.test.mjs tests/round33-renewal.test.mjs
          node tests/round1-simulation.cjs
          node tests/round2-simulation.cjs
          node tests/round3-simulation.cjs
          node tests/round4-lifecycle.cjs
          node tests/round5-balance.cjs
          node tests/round5-simulation.cjs
          node tests/round5-lifetime.cjs
          node tests/round26-coverage.cjs
          node tests/round30-reachability.cjs
          node tests/round31-causal-edges.cjs
          node tests/event-content-audit.cjs --strict
