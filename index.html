    // v2.1.79 主题引导：与 App.applyThemePreference 同源解析，在样式就绪后、首帧渲染前
    // 同步设置 data-theme，避免深色系统用户闪现浅色界面；无 JS 时由 CSS 媒体查询兜底。
    (function () {
      try {
        var t = null; try { t = localStorage.getItem('ui_theme'); } catch (e) {}
        var dark = t === 'dark' ||
          ((t === null || t === 'system') && !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    }());
  </script>

  <script>
    // 启动兜底：外部脚本失败时避免用户面对空白页面。
    (function () {
      'use strict';
      function showBootFailure() {
        var app = document.getElementById('app');
        if (!app || app.querySelector('.game-container, .app-fatal')) return;
        app.innerHTML = '<section class="app-fatal" role="alert" aria-live="assertive">' +
          '<div class="app-fatal-mark" aria-hidden="true">!</div>' +
          '<h1>页面没有完整加载</h1>' +
          '<p>题库或界面资源暂时没有准备好，本地存档不会因此被删除。</p>' +
          '<p class="app-fatal-hint">请重新加载一次；如果仍然失败，可清除本网站缓存后再试。</p>' +
          '<button type="button" class="btn btn-primary" data-boot-retry>重新加载</button>' +
          '</section>';
        var retry = app.querySelector('[data-boot-retry]');
        if (retry) retry.addEventListener('click', function () { window.location.reload(); });
      }
      window.addEventListener('error', function (event) {
        var target = event && event.target;
        if (target && target.tagName === 'SCRIPT') window.setTimeout(showBootFailure, 0);
      }, true);
      window.setTimeout(function () {
        if (!window.App || typeof window.App.init !== 'function' || !document.querySelector('.game-container')) showBootFailure();
      }, 8000);
    }());
  </script>
  <!-- PWA -->
