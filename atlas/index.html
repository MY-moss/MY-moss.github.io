<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e9">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="index,follow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>ATLAS — Personal Intelligence Library</title>
  <meta name="description" content="A public library of news, open source, reading, design and ideas.">
  <link rel="stylesheet" href="./styles.css?v=2">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f342d'/%3E%3Cpath d='M15 43 32 12l17 31H15Z' fill='none' stroke='%23e8d8b5' stroke-width='3'/%3E%3Ccircle cx='32' cy='36' r='5' fill='%23d5a36b'/%3E%3C/svg%3E">
  <script defer src="./config.js?v=2"></script>
  <script defer src="./app.js?v=2"></script>
</head>
<body>
  <div class="workspace" id="workspace" aria-hidden="false">
    <aside class="sidebar">
      <a class="brand" href="./" aria-label="ATLAS 首页"><span class="brand-symbol">A</span><span><strong>ATLAS</strong><small>PERSONAL INTELLIGENCE</small></span></a>
      <div class="sidebar-label">WORKSPACE</div>
      <nav class="primary-nav" aria-label="主导航">
        <button class="nav-item is-active" data-view="overview"><span class="nav-icon">⌂</span><span>总览</span><kbd>01</kbd></button>
        <button class="nav-item" data-view="world"><span class="nav-icon">◉</span><span>世界新闻</span><kbd>02</kbd></button>
        <button class="nav-item" data-view="reading"><span class="nav-icon">▤</span><span>精选阅读</span><kbd>03</kbd></button>
        <button class="nav-item" data-view="opensource"><span class="nav-icon">⌘</span><span>开源雷达</span><kbd>04</kbd></button>
        <button class="nav-item" data-view="inspiration"><span class="nav-icon">✳</span><span>灵感采集</span><kbd>05</kbd></button>
        <button class="nav-item" data-view="knowledge"><span class="nav-icon">⌁</span><span>知识回顾</span><kbd>06</kbd></button>
      </nav>
      <div class="sidebar-label sidebar-label-spaced">PERSONAL</div>
      <nav class="primary-nav" aria-label="个人空间">
        <button class="nav-item" data-view="archive"><span class="nav-icon">▦</span><span>历史档案</span></button>
        <button class="nav-item" data-view="bookmarks"><span class="nav-icon">♡</span><span>我的书架</span><span class="nav-count" id="bookmark-count">0</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sync-card">
          <span class="sync-indicator" id="sync-indicator"></span>
          <div><strong id="sync-label">正在加载</strong><small id="sync-detail">公开内容索引</small></div>
          <button class="icon-button" id="refresh-button" title="刷新内容" aria-label="刷新内容">↻</button>
        </div>
        <button class="nav-item nav-settings" data-view="settings"><span class="nav-icon">⚙</span><span>设置与连接</span></button>
        <div class="profile-row"><div class="profile-avatar">A</div><div><strong>ATLAS</strong><small>PUBLIC EDITION</small></div></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>ATLAS</span><i>/</i><strong id="breadcrumb-current">总览</strong></div>
        <div class="topbar-actions">
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="global-search" type="search" placeholder="搜索文章、项目、观点…" autocomplete="off"><kbd>⌘ K</kbd></label>
          <button class="icon-button theme-button" id="theme-button" title="切换主题" aria-label="切换主题">◐</button>
          <button class="button button-quiet" id="top-refresh">刷新内容 <span>↻</span></button>
        </div>
      </header>
      <div class="mobile-nav" aria-label="移动端导航">
        <button data-view="overview" class="is-active">总览</button><button data-view="world">世界</button><button data-view="reading">阅读</button><button data-view="opensource">开源</button><button data-view="inspiration">灵感</button><button data-view="knowledge">回顾</button>
      </div>
      <div class="page-content" id="page-content">
        <div class="loading-state"><span class="loader"></span><p>正在整理你的知识地图…</p></div>
      </div>
      <footer class="site-footer"><span>ATLAS · OPEN INTELLIGENCE LIBRARY</span><span>CURATED WITH INTENTION <i>✳</i></span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
